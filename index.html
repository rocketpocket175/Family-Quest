<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1B4332;
    --forest-deep:#12301F;
    --gold:#F2A93B;
    --sky:#4FB0C6;
    --berry:#D6336C;
    --parchment:#FFF7E8;
    --parchment-dark:#F2E4C4;
    --ink:#2B2117;
    --lock:#B9AE9A;
    --danger:#C1443A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(79,176,198,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(242,169,59,0.2), transparent 45%),
      var(--forest);
    color:var(--ink);
    min-height:100vh;
    padding:20px;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0;}
  .app{max-width:1320px;margin:0 auto;}

  .app-shell{display:flex;gap:18px;align-items:flex-start;}
  .sidebar-left{flex:0 0 300px;width:300px;position:sticky;top:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);}
  .sidebar-right{flex:0 0 300px;width:300px;position:sticky;top:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);}
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;}
  .sidebar-left .card, .sidebar-right .card{margin-bottom:0;}
  .sidebar-scroll{overflow-y:auto;}
  .kid-switcher{margin-top:auto;position:sticky;bottom:0;}
  .kid-switcher .kidgrid{display:flex;flex-wrap:wrap;gap:8px;}
  .kid-switcher .kid-chip{flex:0 0 calc(50% - 4px);justify-content:center;}
  .kid-switcher .kid-chip.add{flex:1 0 100%;}

  @media (max-width: 980px){
    .app-shell{flex-direction:column;}
    .sidebar-left, .sidebar-right{width:100%;flex:1 1 auto;position:static;max-height:none;}
    .kid-switcher{position:static;}
  }
  .header{text-align:center;color:var(--parchment);margin-bottom:10px;}
  .header h1{font-size:2rem;color:#fff;text-shadow:0 3px 0 var(--forest-deep);}
  .header p{margin:4px 0 0;opacity:.85;font-weight:600;}

  .toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar button{
    background:rgba(255,255,255,.12);color:var(--parchment);border:2px solid rgba(255,255,255,.25);
    border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem;cursor:pointer;font-family:'Nunito';
  }
  .toolbar button:hover{background:rgba(255,255,255,.22);}
  .toolbar button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);}

  .kidbar{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;}
  .kid-chip{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    background:var(--parchment);border:3px solid transparent;border-radius:999px;
    padding:6px 14px 6px 6px;cursor:pointer;font-weight:800;font-family:'Baloo 2';
    transition:transform .15s ease, border-color .15s ease;
  }
  .kid-chip .av{width:34px;height:34px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;}
  .kid-chip .av img{width:100%;height:100%;object-fit:cover;}
  .kid-chip.active{border-color:var(--gold);transform:translateY(-2px);}
  .kid-chip.add{background:transparent;border:3px dashed rgba(255,255,255,.5);color:var(--parchment);}

  .card{background:var(--parchment);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 24px rgba(0,0,0,.25);}

  .questtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;flex-wrap:wrap;}
  .questtitle .who{display:flex;align-items:center;gap:10px;}
  .av-big{width:48px;height:48px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;cursor:pointer;border:3px solid var(--gold);}
  .av-big img{width:100%;height:100%;object-fit:cover;}
  .level-badge{background:var(--forest);color:#fff;padding:4px 12px;border-radius:999px;font-weight:800;font-family:'Baloo 2';font-size:.85rem;}
  svg{width:100%;height:auto;display:block;}
  .xpbar{height:14px;background:var(--parchment-dark);border-radius:999px;overflow:hidden;margin-top:10px;border:2px solid var(--forest);}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--berry));transition:width .4s ease;}
  .xplabel{font-size:.8rem;font-weight:700;margin-top:4px;text-align:right;color:var(--forest);}

  .avatar-picker{margin-top:12px;padding-top:12px;border-top:2px dashed var(--parchment-dark);}
  .avatar-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .avatar-grid button{width:36px;height:36px;font-size:18px;border-radius:50%;border:2px solid var(--parchment-dark);background:#fff;cursor:pointer;}
  .avatar-picker input[type=file]{font-size:.75rem;}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .section-title.clickable{cursor:pointer;user-select:none;}
  .section-title .tag{background:var(--forest);color:#fff;font-size:.7rem;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.03em;}
  .chevron{display:inline-block;font-size:1rem;color:var(--forest);transition:transform .2s ease;flex:0 0 auto;}
  .chevron.closed{transform:rotate(-90deg);}
  .card-body.hidden{display:none;}

  .taskgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .task{
    background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;
    border:2px solid var(--parchment-dark);position:relative;
  }
  .task.compact{padding:10px;}
  .pin-btn{
    position:absolute;top:6px;right:6px;background:none;border:none;font-size:15px;cursor:pointer;
    opacity:.35;padding:3px;border-radius:8px;line-height:1;
  }
  .pin-btn:hover{opacity:.7;background:rgba(0,0,0,.06);}
  .pin-btn.pinned{opacity:1;background:var(--gold);}
  .task .top{display:flex;align-items:center;gap:8px;font-weight:700;}
  .task .emoji{font-size:22px;}
  .task .pts{font-size:.75rem;color:var(--forest);font-weight:800;}
  .task button{
    border:none;border-radius:10px;padding:8px;font-weight:800;font-family:'Baloo 2';
    background:var(--forest);color:#fff;cursor:pointer;transition:transform .1s;
  }
  .task button:active{transform:scale(.95);}

  .rewardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;}
  .reward{
    aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--parchment-dark);font-size:26px;gap:2px;position:relative;
  }
  .reward.unlocked{background:linear-gradient(160deg,#fff,var(--parchment));border:2px solid var(--gold);}
  .reward .lv{font-size:.6rem;font-weight:800;color:var(--forest);}
  .reward.locked{filter:grayscale(1);opacity:.55;}

  .goodie-list{display:flex;flex-direction:column;gap:8px;}
  .goodie{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 12px;
  }
  .goodie-req{flex:1 0 100%;font-size:.7rem;color:var(--danger);font-weight:700;}
  .goodie .emoji{font-size:24px;}
  .goodie .txt{flex:1;font-weight:700;}
  .goodie .lvl{font-size:.7rem;color:var(--forest);font-weight:800;}
  .goodie button{background:var(--gold);border:none;border-radius:10px;padding:7px 12px;font-weight:800;font-family:'Baloo 2';cursor:pointer;}
  .goodie.redeemed{border-color:var(--parchment-dark);opacity:.7;}
  .goodie.redeemed .txt{text-decoration:line-through;}
  .goodie .when{font-size:.7rem;color:#9a8f78;font-weight:700;}
  .empty-small{font-size:.85rem;color:#9a8f78;font-weight:700;}

  .log{list-style:none;padding:0;margin:0;max-height:220px;overflow-y:auto;}
  .log li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--parchment-dark);font-size:.85rem;font-weight:600;}
  .log li:last-child{border:none;}
  .log .when{color:#9a8f78;font-weight:600;font-size:.75rem;}
  .log .row{display:flex;align-items:center;gap:8px;flex:1;}
  .log .who-av{width:22px;height:22px;border-radius:50%;overflow:hidden;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;}
  .log .who-av img{width:100%;height:100%;object-fit:cover;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;}
  .icon-btn:hover{background:rgba(0,0,0,.08);}
  .icon-btn.danger{color:var(--danger);}

  .leaderboard-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .leaderboard-toggle button{
    border:2px solid var(--forest);background:#fff;color:var(--forest);border-radius:999px;padding:5px 14px;font-weight:800;font-family:'Baloo 2';cursor:pointer;font-size:.8rem;
  }
  .leaderboard-toggle button.on{background:var(--forest);color:#fff;}
  .lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .lb-list li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;}
  .lb-list .rank{width:26px;text-align:center;font-weight:800;}
  .lb-list .av{width:30px;height:30px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;}
  .lb-list .av img{width:100%;height:100%;object-fit:cover;}
  .lb-list .name{flex:1;}
  .lb-list .pts{color:var(--forest);font-weight:800;}
  .lb-list .team-tag{font-size:.7rem;background:var(--parchment-dark);padding:2px 8px;border-radius:999px;}

  .addform{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
  .addform input,.addform select{
    padding:8px 10px;border-radius:10px;border:2px solid var(--parchment-dark);font-family:'Nunito';font-weight:700;
  }
  .addform input[type=text]{flex:1;min-width:120px;}
  .addform input[type=number]{width:80px;}
  .addform button{background:var(--sky);border:none;border-radius:10px;padding:8px 14px;font-weight:800;font-family:'Baloo 2';cursor:pointer;color:#fff;}

  .parent-block{margin-top:16px;padding-top:16px;border-top:2px dashed var(--parchment-dark);}
  .parent-block h4{margin:0 0 8px;font-family:'Baloo 2';}
  .mini-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .mini-list .row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;}
  .mini-list .row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;flex-wrap:wrap;}
  .mini-list .row input, .mini-list .row select{
    padding:5px 7px;border-radius:8px;border:2px solid var(--parchment-dark);font-family:'Nunito';font-weight:700;font-size:.85rem;
  }
  .mini-list .row input[type=text]{min-width:60px;}
  .mini-list .row input.grow, .mini-list .row input[data-grow]{flex:1;min-width:100px;}
  .mini-list .row span.grow{flex:1;}
  .team-chip{display:inline-flex;align-items:center;gap:4px;background:var(--parchment-dark);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:800;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,48,31,.55);display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal-box{
    background:var(--parchment);border-radius:18px;padding:22px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.35);text-align:center;
  }
  .modal-box p{font-weight:700;margin:6px 0 12px;}
  .modal-box input[type=password]{
    width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--parchment-dark);font-size:1.1rem;
    letter-spacing:.2em;text-align:center;font-family:'Nunito';font-weight:800;
  }
  .pw-error{color:var(--danger);font-weight:800;font-size:.8rem;margin-top:8px;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{flex:1;border:none;border-radius:10px;padding:9px;font-weight:800;font-family:'Baloo 2';cursor:pointer;}
  #pwCancel{background:var(--parchment-dark);color:var(--ink);}
  #pwSubmit{background:var(--forest);color:#fff;}

  .task .btnrow{display:flex;gap:6px;}
  .task .btnrow button{flex:1;}
  .task button.team-btn{background:var(--sky);}
  .team-picker{margin-top:8px;padding-top:8px;border-top:2px dashed var(--parchment-dark);}
  .team-picker label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;padding:4px 0;}
  .team-picker .confirm-btn{margin-top:8px;width:100%;background:var(--forest);color:#fff;border:none;border-radius:10px;padding:8px;font-weight:800;font-family:'Baloo 2';cursor:pointer;}
  .team-note{font-size:.7rem;color:var(--forest);font-weight:700;}

  .lock-banner{
    display:flex;align-items:center;gap:10px;background:#FBE4E1;border:2px solid var(--danger);color:#7A241D;
    border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px;
  }
  .lock-banner .icon-btn{margin-left:auto;}
  button:disabled, .task button:disabled, .goodie button:disabled{
    opacity:.4;cursor:not-allowed;filter:grayscale(.3);
  }

  .sanction-list{display:flex;flex-direction:column;gap:8px;}
  .sanction{
    display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--danger);border-radius:14px;padding:10px 12px;
  }
  .sanction .emoji{font-size:22px;}
  .sanction .txt{flex:1;font-weight:700;}
  .sanction .meta{font-size:.7rem;color:#9a8f78;font-weight:700;}
  .sanction.expired{opacity:.55;border-color:var(--parchment-dark);}

  .toggle-parent{text-align:center;margin-top:6px;}
  .toggle-parent button{
    background:none;border:none;color:var(--parchment);opacity:.7;font-weight:700;cursor:pointer;font-size:.8rem;
    text-decoration:underline;
  }
  .empty{text-align:center;color:#9a8f78;font-weight:700;padding:12px;}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🏰 Family Quest</h1>
    <p>Punkte sammeln. Level aufsteigen. Legende werden.</p>
  </div>

  <div class="app-shell">
    <aside class="sidebar-left" id="sidebarLeft"></aside>
    <main class="main-col" id="mainCol"></main>
    <aside class="sidebar-right" id="sidebarRight"></aside>
  </div>

  <div class="toggle-parent">
    <button id="parentToggle">Eltern-Modus</button>
  </div>
  <input type="file" id="importJsonInput" accept="application/json" style="display:none;">
</div>

<div class="modal-overlay" id="pwModal" style="display:none;">
  <div class="modal-box">
    <h3>🔒 Eltern-Modus</h3>
    <p>Bitte Passwort eingeben:</p>
    <input type="password" id="pwInput" inputmode="numeric" autocomplete="off" placeholder="•••••">
    <div class="pw-error" id="pwError" style="display:none;">Falsches Passwort.</div>
    <div class="modal-actions">
      <button id="pwCancel">Abbrechen</button>
      <button id="pwSubmit">Bestätigen</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const STORAGE_KEY = 'family-quest-data';
const SUPABASE_URL =
  'https://wqgnbqlnwsbbighgobhb.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_SM58ZBLVBdVxaiSWE_LHLQ_ic8HDwwY';

const APP_STATE_ID = 'family-quest';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let suppressRealtimeUpdate = false;
let state = {
  categories: ['Haushalt','Lernen'],
  pinnedTaskIds: [],
  tasks: [
    {id:'t1', cat:'Haushalt', name:'Zimmer aufräumen', emoji:'🧹', pts:10},
    {id:'t2', cat:'Haushalt', name:'Tisch decken', emoji:'🍽️', pts:5},
    {id:'t3', cat:'Haushalt', name:'Müll rausbringen', emoji:'🗑️', pts:5},
    {id:'t4', cat:'Haushalt', name:'Wäsche zusammenlegen', emoji:'🧺', pts:8},
    {id:'t5', cat:'Haushalt', name:'Spülmaschine ausräumen', emoji:'🍴', pts:8},
    {id:'t6', cat:'Haushalt', name:'Haustier füttern', emoji:'🐶', pts:5},
    {id:'t7', cat:'Lernen', name:'Hausaufgaben', emoji:'📚', pts:15},
    {id:'t8', cat:'Lernen', name:'20 Min lesen', emoji:'📖', pts:10},
    {id:'t9', cat:'Lernen', name:'Matheübung', emoji:'➗', pts:10},
    {id:'t10', cat:'Lernen', name:'Vokabeln lernen', emoji:'🔤', pts:10},
  ],
  teams: [],
  goodies: [
    {id:'g1', level:1, emoji:'🍬', text:'Eine Süßigkeit aussuchen', requirementId:null},
    {id:'g2', level:2, emoji:'📺', text:'15 Minuten Fernsehen', requirementId:null},
    {id:'g3', level:3, emoji:'🎮', text:'15 Minuten Zocken', requirementId:null},
    {id:'g4', level:4, emoji:'🍕', text:'Lieblingsessen aussuchen', requirementId:null},
    {id:'g5', level:5, emoji:'🎬', text:'Filmabend aussuchen', requirementId:null},
  ],
  pointRewards: [
    {id:'pr1', interval:30, emoji:'📺', text:'Medienzeit (15 Min)', requirementId:null},
  ],
  redemptionRequirements: [],
  sanctionTypes: [
    {id:'s1', emoji:'⛔', label:'Aufgabe verweigert', kind:'points', value:10},
    {id:'s2', emoji:'📴', label:'Bildschirmzeit gesperrt', kind:'lock', value:24},
    {id:'s3', emoji:'🚫', label:'Goodie gestrichen', kind:'goodie', value:0},
  ],
  kids: []
};

let activeKidId = null;
let parentMode = false;
const PARENT_PASSWORD = '86169';
let leaderboardView = 'overall'; // 'overall' | 'daily'
let avatarEditorOpenFor = null;
let teamActivityOpenFor = null;
const TEAM_BONUS = 1.3;
let collapsedPanels = {};

function panelHeader(id, titleHtml, extraHtml){
  const isClosed = !!collapsedPanels[id];
  return `<div class="section-title clickable" data-toggle-panel="${id}">
    <h3>${titleHtml}</h3>
    <div style="display:flex;align-items:center;gap:8px;">${extraHtml||''}<span class="chevron ${isClosed?'closed':''}">▾</span></div>
  </div>`;
}
function panelBodyClass(id){
  return collapsedPanels[id] ? 'card-body hidden' : 'card-body';
}
function attachPanelToggles(){
  document.querySelectorAll('[data-toggle-panel]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('button,select,input')) return;
      const id = el.dataset.togglePanel;
      collapsedPanels[id] = !collapsedPanels[id];
      render();
    };
  });
}

const LEVEL_THRESHOLDS = [0,40,100,180,280,400,550,720,920,1150,1400];
function thresholdFor(level){
  if(level < LEVEL_THRESHOLDS.length) return LEVEL_THRESHOLDS[level];
  const last = LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length-1];
  const lastIdx = LEVEL_THRESHOLDS.length-1;
  return last + (level-lastIdx)*(280 + (level-lastIdx)*40);
}
const LEVEL_TITLES = ['Waldläufer','Schildknappe','Ritter','Silberschild-Ritter','Drachenfreund','Heldenmeister','Kristallwächter','Sagenschmied','Kronenträger','Legende'];
function titleFor(level){ return LEVEL_TITLES[Math.min(level-1, LEVEL_TITLES.length-1)] || 'Mythischer Held'; }
const ITEM_EMOJI = ['🥾','🛡️','⚔️','🏹','🐉','👑','🔮','🦄','🏆','⭐'];
function itemFor(level){ return ITEM_EMOJI[Math.min(level-1, ITEM_EMOJI.length-1)] || '🎁'; }

function levelForPoints(points){
  let lvl = 1;
  while(thresholdFor(lvl) <= points){ lvl++; }
  return lvl;
}

const AVATAR_CHOICES = ['🦊','🐻','🐼','🐯','🦁','🐸','🐨','🦄','🐙','🐧','🐰','🐵','🦉','🐢','🐝','🦋','🐳','🐱'];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function displayDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
}
function displayDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}) + ' ' + dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
async function loadFromCloud() {

try {

  const { data, error } = await supabase
    .from('app_state')
    .select('*')
    .eq('id', APP_STATE_ID)
    .single();

  if (error) {
  console.error("Cloud Fehler:", error);
  return true;
}
console.log("Cloud geladen:", data);

  if (data && data.state) {

    state = Object.assign(state, data.state);

    if(state.kids.length && !activeKidId){
      activeKidId = state.kids[0].id;
    }

    return true;
  }

} catch(err){
  console.error(err);
}

return false;
}

async function saveToCloud() {

try {

  suppressRealtimeUpdate = true;

  const { error } = await supabase
    .from('app_state')
    .upsert({
      id: APP_STATE_ID,
      state: state,
      updated_at: new Date().toISOString()
    });

  if(error){
    console.error(error);
  }

  setTimeout(() => {
    suppressRealtimeUpdate = false;
  }, 500);

} catch(err){
  console.error(err);
}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      if(!state.pointRewards) state.pointRewards = parsed.pointRewards || [
        {id:'pr1', interval:30, emoji:'📺', text:'Medienzeit (15 Min)'},
      ];
      if(!state.sanctionTypes) state.sanctionTypes = parsed.sanctionTypes || [
        {id:'s1', emoji:'⛔', label:'Aufgabe verweigert', kind:'points', value:10},
        {id:'s2', emoji:'📴', label:'Bildschirmzeit gesperrt', kind:'lock', value:24},
        {id:'s3', emoji:'🚫', label:'Goodie gestrichen', kind:'goodie', value:0},
      ];
      if(!state.pinnedTaskIds) state.pinnedTaskIds = parsed.pinnedTaskIds || [];
      if(!state.redemptionRequirements) state.redemptionRequirements = parsed.redemptionRequirements || [];
    }
  }catch(e){ console.error('Laden fehlgeschlagen', e); }
  state.goodies.forEach(g=>{ if(g.requirementId === undefined) g.requirementId = null; });
  state.pointRewards.forEach(r=>{ if(r.requirementId === undefined) r.requirementId = null; });
  state.kids.forEach(k=>{
    if(!k.sanctions) k.sanctions = [];
    if(k.lockedUntil === undefined) k.lockedUntil = null;
    if(!k.blockedGoodieIds) k.blockedGoodieIds = [];
    if(!k.redeemedPointRewards) k.redeemedPointRewards = {};
    if(!k.pointRewardLog) k.pointRewardLog = [];
  });
  if(state.kids.length && !activeKidId) activeKidId = state.kids[0].id;
  render();
}

try{

  localStorage.setItem(

  );

}catch(e){

function completeTask(kid, task){
  kid.points += task.pts;
  kid.log.unshift({id:'l'+Date.now()+Math.floor(Math.random()*1000), name:task.name, emoji:task.emoji, pts:task.pts, cat:task.cat, taskId:task.id, date: todayISO(), when: displayDate(new Date()), at: new Date().toISOString()});
  unpinTask(task.id);
  saveState(); render();
}

function completeTaskTeam(kid, task, otherKidIds){
  const others = otherKidIds.map(id=>state.kids.find(k=>k.id===id)).filter(Boolean);
  const participants = [kid, ...others];
  const n = participants.length;
  if(n < 2){ completeTask(kid, task); return; }

  const totalPoints = Math.round(task.pts * TEAM_BONUS);
  const base = Math.floor(totalPoints / n);
  const remainder = totalPoints - base*n;
  const nowIso = new Date().toISOString();

  participants.forEach((p, i)=>{
    const share = base + (i < remainder ? 1 : 0);
    p.points += share;
    const teammates = participants.filter(x=>x.id!==p.id).map(x=>x.name);
    p.log.unshift({
      id:'l'+Date.now()+Math.floor(Math.random()*10000)+i,
      name: task.name, emoji: task.emoji, pts: share, cat: task.cat, taskId: task.id,
      date: todayISO(), when: displayDate(new Date()), at: nowIso,
      team: teammates
    });
  });

  unpinTask(task.id);
  teamActivityOpenFor = null;
  saveState(); render();
}

  if(!requirementId) return true;
  const req = state.redemptionRequirements.find(r=>r.id===requirementId);
  if(!req) return true;
  return pointsTodayInCategory(kid, req.category) >= req.minPoints;
}

function availablePointRewardCount(kid, reward){
  const earned = Math.floor(kid.points / reward.interval);
  const redeemed = kid.redeemedPointRewards[reward.id] || 0;
  return Math.max(0, earned - redeemed);
}
function redeemPointReward(kid, rewardId){
  const reward = state.pointRewards.find(r=>r.id===rewardId);
  if(!reward) return;
  if(availablePointRewardCount(kid, reward) <= 0) return;
  if(!meetsRequirement(kid, reward.requirementId)) return;
  kid.redeemedPointRewards[rewardId] = (kid.redeemedPointRewards[rewardId] || 0) + 1;
  kid.pointRewardLog.unshift({id:'pl'+Date.now(), rewardId, emoji: reward.emoji, text: reward.text, at: new Date().toISOString()});
  saveState(); render();
}

function unredeemPointReward(kid, logId){
  const entry = kid.pointRewardLog.find(l=>l.id===logId);
  if(!entry) return;
  if(!confirm(`„${entry.text}" wieder als nicht eingelöst markieren? Steht ${escapeHtml(kid.name)} danach wieder zur Verfügung.`)) return;
  if(kid.redeemedPointRewards[entry.rewardId]){
    kid.redeemedPointRewards[entry.rewardId] = Math.max(0, kid.redeemedPointRewards[entry.rewardId] - 1);

  saveState(); render();
}

function applySanction(kid, sanctionTypeId, note, goodieId){
  const st = state.sanctionTypes.find(s=>s.id===sanctionTypeId);
  if(!st) return;
  const entry = {
    id:'sa'+Date.now(), typeId: st.id, emoji: st.emoji, label: st.label, kind: st.kind,
    value: st.value, note: note || '', appliedAt: new Date().toISOString(), expiresAt: null, goodieId: null
  };
  if(st.kind === 'points'){
    kid.points = Math.max(0, kid.points - st.value);
  } else if(st.kind === 'lock'){
    const until = new Date(Date.now() + st.value*60*60*1000);
    kid.lockedUntil = until.toISOString();
    entry.expiresAt = kid.lockedUntil;
  } else if(st.kind === 'goodie'){
    if(!goodieId) return;
    if(!kid.blockedGoodieIds.includes(goodieId)) kid.blockedGoodieIds.push(goodieId);
    if(kid.redeemed[goodieId]) delete kid.redeemed[goodieId];
    entry.goodieId = goodieId;
    const g = state.goodies.find(g=>g.id===goodieId);
    entry.label = st.label + (g ? `: ${g.text}` : '');
  }
  kid.sanctions.unshift(entry);
  saveState(); render();
}

function removeSanction(kid, sanctionId){
  const entry = kid.sanctions.find(s=>s.id===sanctionId);
  if(!entry) return;
  if(!confirm(`Sanktion „${entry.label}" wirklich zurücknehmen?`)) return;
  if(entry.kind === 'points'){
    kid.points += entry.value;
  } else if(entry.kind === 'lock'){
    if(kid.lockedUntil === entry.expiresAt) kid.lockedUntil = null;
  } else if(entry.kind === 'goodie' && entry.goodieId){
    kid.blockedGoodieIds = kid.blockedGoodieIds.filter(id=>id!==entry.goodieId);
  }
  kid.sanctions = kid.sanctions.filter(s=>s.id!==sanctionId);
  saveState(); render();
}

    };

    state.pointRewards.forEach(r=>{ if(r.requirementId === undefined) r.requirementId = null; });
    state.kids.forEach(k=>{

      if(k.teamId === undefined) k.teamId = null;
      if(!k.sanctions) k.sanctions = [];

function questPathSVG(level){
  const nodes = 6;
  const curLevelInWindow = ((level-1) % nodes);
  const coords = [];
  for(let i=0;i<nodes;i++){
    const x = 40 + i*((100*7)/(nodes-1));
    const y = 60 + Math.sin(i*1.1)*30;
    coords.push([x,y]);
  }
  let path = 'M ' + coords.map(c=>c.join(' ')).join(' L ');
  const markers = coords.map((c,i)=>{
    const lvl = level - curLevelInWindow + i;
    const reached = i <= curLevelInWindow;
    const isCurrent = i === curLevelInWindow;
    return `<g>
      <circle cx="${c[0]}" cy="${c[1]}" r="${isCurrent?20:15}" fill="${reached?'var(--gold)':'#ffffff'}" stroke="var(--forest)" stroke-width="3"/>
      <text x="${c[0]}" y="${c[1]+5}" text-anchor="middle" font-size="14" font-weight="800" fill="${reached?'#2B2117':'#B9AE9A'}">${lvl>0?lvl:''}</text>
      ${isCurrent ? `<text x="${c[0]}" y="${c[1]-28}" text-anchor="middle" font-size="22">🧭</text>` : ''}
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
    <path d="${path}" fill="none" stroke="var(--parchment-dark)" stroke-width="8" stroke-linecap="round"/>
    ${markers}
  </svg>`;
}

            <span class="pts">${r.pts} P.</span>
          </li>`).join('')}
        </ul>
      </div>`;
  }

  return `
    <div class="card">
      ${panelHeader('leaderboard', '🏆 Bestenliste')}
      <div class="${panelBodyClass('leaderboard')}">
        <div class="leaderboard-toggle">
          <button class="${leaderboardView==='overall'?'on':''}" data-lb="overall">Gesamt</button>
          <button class="${leaderboardView==='daily'?'on':''}" data-lb="daily">Heute</button>
        </div>
        ${listHtml}
        ${teamHtml}
      </div>
    </div>
  `;
}

function renderGlobalHistory(){
  const all = [];
  state.kids.forEach(k=>{
    k.log.forEach(l=> all.push(Object.assign({}, l, {kidId:k.id, kidName:k.name, kidAvatar:k.avatar})));
  });
  all.sort((a,b)=> new Date(b.at||b.date) - new Date(a.at||a.date));
  const top = all.slice(0,25);
  return `
    <div class="card">
      ${panelHeader('history', '📜 Letzte Heldentaten')}
      <div class="${panelBodyClass('history')}">
        ${top.length ? `<ul class="log">${top.map(l=>`<li>
          <span class="row">
            <span class="who-av">${avatarHtml(l.kidAvatar,22)}</span>
            ${l.emoji} ${escapeHtml(l.kidName)}: ${escapeHtml(l.name)} (+${l.pts})${l.team && l.team.length ? ` <span class="team-note">👥 mit ${escapeHtml(l.team.join(', '))}</span>` : ''}
          </span>
          <span class="when">${displayDateTime(l.at || l.date)}</span>
          ${parentMode ? `<button class="icon-btn danger" data-delete-log="${l.id}" data-delete-log-kid="${l.kidId}" title="Löschen">🗑️</button>` : ''}
        </li>`).join('')}</ul>` : '<div class="empty">Noch keine Einträge — leg direkt los!</div>'}
      </div>
    </div>
  `;
}

function renderPinnedTasks(kid, locked){
  const items = kid ? state.pinnedTaskIds.map(id=>state.tasks.find(t=>t.id===id)).filter(Boolean) : [];
  return `
    <div class="card">
      ${panelHeader('pinned', '📋 Aktuelle Ausschreibung')}
      <div class="${panelBodyClass('pinned')}">
        <div class="taskgrid">
          ${items.length ? items.map(t=> taskCardHtml(t, kid, locked, true)).join('') : `<div class="empty-small">Nichts ausgeschrieben. Auf 📌 bei einer Aufgabe tippen, um sie hierher zu holen.</div>`}
        </div>
      </div>
    </div>
  `;
}

function render(){
  console.log("RENDER");

  const kid = state.kids.find(k=>k.id===activeKidId);
  document.getElementById('parentToggle').textContent = parentMode ? 'Eltern-Modus verlassen' : 'Eltern-Modus';

  const sidebarLeft = document.getElementById('sidebarLeft');
  const mainCol = document.getElementById('mainCol');
  const sidebarRight = document.getElementById('sidebarRight');

  if(!kid){
    sidebarLeft.innerHTML = `${renderLeaderboard()}
      <div class="card kid-switcher">
        ${panelHeader('kidswitch', '👪 Wer bist du?')}
        <div class="${panelBodyClass('kidswitch')}">
          <div class="kidgrid" id="kidSwitcherGrid"></div>
        </div>
      </div>`;
    mainCol.innerHTML = `
      <div class="card empty">Noch kein Kind angelegt.<br>${parentMode ? 'Unten im Eltern-Bereich ein Profil anlegen! 🎉' : 'Eltern-Modus öffnen, um ein Profil anzulegen.'}</div>
      ${parentMode ? renderParentPanel(null) : ''}
    `;
    sidebarRight.innerHTML = renderPinnedTasks(null, true) + renderGlobalHistory();
    renderKidBar();
    attachGlobalHandlers();
    attachPanelToggles();
    attachParentOnlyHandlers(null);
    return;
  }

  const level = levelForPoints(kid.points);
  const curThresh = thresholdFor(level-1);
  const nextThresh = thresholdFor(level);
  const progress = Math.min(100, Math.round(((kid.points-curThresh)/(nextThresh-curThresh))*100));

  const tasksByCat = {};
  state.categories.forEach(c=> tasksByCat[c] = []);
  state.tasks.forEach(t=>{ (tasksByCat[t.cat] = tasksByCat[t.cat]||[]).push(t); });

  const maxRewardLevel = Math.max(level+2, 10);
  let rewardsHtml = '';
  for(let l=1;l<=maxRewardLevel;l++){
    const unlocked = level >= l;
    rewardsHtml += `<div class="reward ${unlocked?'unlocked':'locked'}">
      <div>${unlocked ? itemFor(l) : '🔒'}</div>
      <div class="lv">Lvl ${l}</div>
    </div>`;
  }

  const locked = isLocked(kid);
  const availableGoodies = state.goodies.filter(g=>g.level<=level && !kid.redeemed[g.id] && !kid.blockedGoodieIds.includes(g.id));
  const redeemedGoodies = state.goodies.filter(g=>kid.redeemed[g.id]).sort((a,b)=> new Date(kid.redeemed[b.id]) - new Date(kid.redeemed[a.id]));

  sidebarLeft.innerHTML = `
    ${renderLeaderboard()}

    <div class="card">
      ${panelHeader('quest', `${escapeHtml(kid.name)} · Lvl ${level} · ${titleFor(level)}`)}
      <div class="${panelBodyClass('quest')}">
        ${questPathSVG(level)}
        <div class="xpbar"><div class="xpfill" style="width:${progress}%"></div></div>
        <div class="xplabel">${kid.points} / ${nextThresh} Punkte bis Level ${level+1}</div>
        <div style="text-align:center;margin-top:10px;">
          <span class="av-big" id="avatarTrigger" style="display:inline-flex;">${avatarHtml(kid.avatar,48)}</span>
        </div>

        ${avatarEditorOpenFor===kid.id ? `
        <div class="avatar-picker">
          <strong>Avatar wählen:</strong>
          <div class="avatar-grid">
            ${AVATAR_CHOICES.map(a=>`<button data-avatar-emoji="${a}">${a}</button>`).join('')}
          </div>
          <div>oder eigenes Bild hochladen: <input type="file" accept="image/*" id="avatarFileInput"></div>
        </div>` : ''}
      </div>
    </div>

    <div class="card kid-switcher">
      ${panelHeader('kidswitch', '👪 Account wechseln')}
      <div class="${panelBodyClass('kidswitch')}">
        <div class="kidgrid" id="kidSwitcherGrid"></div>
      </div>
    </div>
  `;

  mainCol.innerHTML = `
    ${locked ? `<div class="lock-banner">🚫 ${escapeHtml(kid.name)} ist gesperrt bis ${displayDateTime(kid.lockedUntil)}</div>` : ''}

    ${Object.keys(tasksByCat).map(cat=>{
      const pid = 'cat-'+cat;
      return `
      <div class="card">
        ${panelHeader(pid, `${cat==='Haushalt'?'🧹':cat==='Lernen'?'📚':'✨'} ${escapeHtml(cat)}`)}
        <div class="${panelBodyClass(pid)}">
          <div class="taskgrid">
            ${tasksByCat[cat].length ? tasksByCat[cat].map(t=> taskCardHtml(t, kid, locked, false)).join('') : `<div class="empty-small">Noch keine Aufgaben in dieser Kategorie.</div>`}
          </div>
        </div>
      </div>
    `;}).join('')}

    <div class="card">
      ${panelHeader('pointrewards', '💰 Punkte-Belohnungen')}
      <div class="${panelBodyClass('pointrewards')}">
        <div class="goodie-list">
          ${state.pointRewards.length ? state.pointRewards.map(r=>{
            const count = availablePointRewardCount(kid, r);
            if(count <= 0) return '';
            const ok = meetsRequirement(kid, r.requirementId);
            const req = r.requirementId ? state.redemptionRequirements.find(x=>x.id===r.requirementId) : null;
            return `
            <div class="goodie">
              <span class="emoji">${r.emoji}</span>
              <span class="txt">${escapeHtml(r.text)}</span>
              <span class="lvl">je ${r.interval} P. ${count>1?`· x${count} verfügbar`:''}</span>
              <button data-redeem-points="${r.id}" ${(locked||!ok)?'disabled':''} title="${locked?'Gesperrt':(!ok?'Voraussetzung nicht erfüllt':'')}">Einlösen</button>
              ${req && !ok ? `<span class="goodie-req">🔒 Voraussetzung: heute ≥${req.minPoints} P. in „${escapeHtml(req.category)}" (bisher ${pointsTodayInCategory(kid, req.category)})</span>` : ''}
            </div>`;
          }).join('') : ''}
          ${state.pointRewards.every(r=>availablePointRewardCount(kid,r)===0) ? `<div class="empty-small">Noch nichts verfügbar — weiter Punkte sammeln!</div>` : ''}
          ${kid.pointRewardLog.slice(0,6).map(l=>`
            <div class="goodie redeemed">
              <span class="emoji">${l.emoji}</span>
              <span class="txt">${escapeHtml(l.text)}</span>
              <span class="when">eingelöst ${displayDateTime(l.at)}</span>
              ${parentMode ? `<button class="icon-btn danger" data-unredeem-points="${l.id}" title="Rückgängig machen">↩️</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      ${panelHeader('goodies', '🎁 Goodies einlösen')}
      <div class="${panelBodyClass('goodies')}">
        <div class="goodie-list">
          ${availableGoodies.length ? availableGoodies.map(g=>{
            const ok = meetsRequirement(kid, g.requirementId);
            const req = g.requirementId ? state.redemptionRequirements.find(x=>x.id===g.requirementId) : null;
            return `
            <div class="goodie">
              <span class="emoji">${g.emoji}</span>
              <span class="txt">${escapeHtml(g.text)}</span>
              <span class="lvl">ab Lvl ${g.level}</span>
              <button data-redeem="${g.id}" ${(locked||!ok)?'disabled':''} title="${locked?'Gesperrt':(!ok?'Voraussetzung nicht erfüllt':'')}">Einlösen</button>
              ${req && !ok ? `<span class="goodie-req">🔒 Voraussetzung: heute ≥${req.minPoints} P. in „${escapeHtml(req.category)}" (bisher ${pointsTodayInCategory(kid, req.category)})</span>` : ''}
            </div>`;
          }).join('') : `<div class="empty-small">Gerade nichts Neues zum Einlösen — nächstes Level bringt wieder was!</div>`}
          ${redeemedGoodies.map(g=>`
            <div class="goodie redeemed">
              <span class="emoji">${g.emoji}</span>
              <span class="txt">${escapeHtml(g.text)}</span>
              <span class="when">eingelöst ${displayDateTime(kid.redeemed[g.id])}</span>
              ${parentMode ? `<button class="icon-btn danger" data-unredeem-goodie="${g.id}" title="Rückgängig machen">↩️</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      ${panelHeader('rewards', '🧰 Belohnungstruhe')}
      <div class="${panelBodyClass('rewards')}">
        <div class="rewardgrid">${rewardsHtml}</div>
      </div>
    </div>

    <div class="card">
      ${panelHeader('sanctions', '⚠️ Sanktionen')}
      <div class="${panelBodyClass('sanctions')}">
        <div class="sanction-list">
          ${kid.sanctions.length ? kid.sanctions.map(s=>{

            return `<div class="sanction ${expired?'expired':''}">
              <span class="emoji">${s.emoji}</span>
              <span class="txt">${escapeHtml(s.label)}${s.note?` — ${escapeHtml(s.note)}`:''}</span>
              <span class="meta">
                ${s.kind==='points' ? `−${s.value} P.` : ''}
                ${s.kind==='lock' ? (expired ? 'abgelaufen' : `bis ${displayDateTime(s.expiresAt)}`) : ''}

              ${parentMode ? `<button class="icon-btn danger" data-remove-sanction="${s.id}" title="Zurücknehmen">↩️</button>` : ''}
            </div>`;
          }).join('') : `<div class="empty-small">Bisher keine Sanktionen — bleibt hoffentlich so! 😉</div>`}
        </div>
      </div>
    </div>

    ${parentMode ? renderParentPanel(kid) : ''}
  `;

  sidebarRight.innerHTML = `
    ${renderPinnedTasks(kid, locked)}
    ${renderGlobalHistory()}
  `;

  renderKidBar();
  attachGlobalHandlers();
  attachPanelToggles();
  attachKidHandlers(kid);
}

        </select>
        <select id="applySanctionGoodie" style="display:none;">
          ${state.goodies.map(g=>`<option value="${g.id}">${g.emoji} ${escapeHtml(g.text)}</option>`).join('')}
        </select>
        <input type="text" id="applySanctionNote" placeholder="Notiz (optional)">
        <button id="applySanctionBtn">Anwenden</button>
      </div>` : ''}
    </div>
    </div>
  </div>
  `;
}

function attachGlobalHandlers(){
  document.querySelectorAll('button[data-lb]').forEach(btn=>{
    btn.onclick = ()=>{ leaderboardView = btn.dataset.lb; render(); };
  });
}

function attachKidHandlers(kid){
  const content = document;

  content.querySelectorAll('button[data-task]').forEach(btn=>{
    btn.onclick = ()=>{
      const task = state.tasks.find(t=>t.id===btn.dataset.task);
      completeTask(kid, task);
    };
  });

  content.querySelectorAll('button[data-redeem]').forEach(btn=>{
    btn.onclick = ()=> redeemGoodie(kid, btn.dataset.redeem);
  });
  content.querySelectorAll('button[data-redeem-points]').forEach(btn=>{
    btn.onclick = ()=> redeemPointReward(kid, btn.dataset.redeemPoints);
  });
  content.querySelectorAll('button[data-unredeem-goodie]').forEach(btn=>{
    btn.onclick = ()=> unredeemGoodie(kid, btn.dataset.unredeemGoodie);
  });
  content.querySelectorAll('button[data-unredeem-points]').forEach(btn=>{
    btn.onclick = ()=> unredeemPointReward(kid, btn.dataset.unredeemPoints);
  });

  content.querySelectorAll('button[data-team-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const taskId = btn.dataset.teamToggle;
      teamActivityOpenFor = (teamActivityOpenFor === taskId) ? null : taskId;
      render();
    };
  });
  content.querySelectorAll('button[data-team-confirm]').forEach(btn=>{
    btn.onclick = ()=>{
      const taskId = btn.dataset.teamConfirm;
      const task = state.tasks.find(t=>t.id===taskId);
      const checked = Array.from(content.querySelectorAll('input[data-team-kid]:checked')).map(cb=>cb.dataset.teamKid);
      if(!checked.length){ alert('Bitte mindestens ein weiteres Kind auswählen — oder normal auf „Erledigt" tippen.'); return; }
      completeTaskTeam(kid, task, checked);
    };
  });

  content.querySelectorAll('button[data-toggle-pin]').forEach(btn=>{
    btn.onclick = ()=> togglePin(btn.dataset.togglePin);
  });

  content.querySelectorAll('button[data-delete-log]').forEach(btn=>{
    btn.onclick = ()=>{
      const targetKid = state.kids.find(k=>k.id===btn.dataset.deleteLogKid) || kid;
      deleteLogEntry(targetKid, btn.dataset.deleteLog);
    };
  });

  const avTrigger = document.getElementById('avatarTrigger');
  if(avTrigger){
    avTrigger.onclick = ()=>{ avatarEditorOpenFor = (avatarEditorOpenFor===kid.id) ? null : kid.id; render(); };
  }
  content.querySelectorAll('button[data-avatar-emoji]').forEach(btn=>{
    btn.onclick = ()=> setAvatarEmoji(kid, btn.dataset.avatarEmoji);
  });
  const avFile = document.getElementById('avatarFileInput');
  if(avFile){
    avFile.onchange = (e)=>{ if(e.target.files[0]) setAvatarFile(kid, e.target.files[0]); };
  }

  if(parentMode){
    attachParentOnlyHandlers(kid);
  }
}

function attachParentOnlyHandlers(kid){
  const content = document;

  const addKidBtn = document.getElementById('addKidBtn');
  if(addKidBtn) addKidBtn.onclick = ()=>{
    const nameInput = document.getElementById('newKidName');
    const name = nameInput.value.trim();
    if(name) addKid(name);
  };

  const exportJsonBtn = document.getElementById('exportJsonBtn');
  if(exportJsonBtn) exportJsonBtn.onclick = exportJson;
  const exportCsvBtn = document.getElementById('exportCsvBtn');
  if(exportCsvBtn) exportCsvBtn.onclick = exportCsv;
  const importJsonBtn = document.getElementById('importJsonBtn');
  if(importJsonBtn) importJsonBtn.onclick = ()=> document.getElementById('importJsonInput').click();

  const addBtn = document.getElementById('addTaskBtn');
  if(addBtn) addBtn.onclick = ()=>{
    const name = document.getElementById('newTaskName').value.trim();
    const emoji = document.getElementById('newTaskEmoji').value.trim();
    const cat = document.getElementById('newTaskCat').value;
    const pts = parseInt(document.getElementById('newTaskPts').value) || 10;
    if(name) addCustomTask(cat, name, emoji, pts);
  };
  content.querySelectorAll('button[data-delete-task]').forEach(btn=>{
    btn.onclick = ()=> deleteTask(btn.dataset.deleteTask);
  });
  content.querySelectorAll('select[data-move-task]').forEach(sel=>{
    sel.onchange = (e)=> moveTaskCategory(sel.dataset.moveTask, e.target.value);
  });
  content.querySelectorAll('[data-edit-task-field]').forEach(el=>{
    el.onchange = (e)=> updateTaskField(el.dataset.editTaskId, el.dataset.editTaskField, e.target.value);
  });

  const addCatBtn = document.getElementById('addCatBtn');
  if(addCatBtn) addCatBtn.onclick = ()=>{
    const name = document.getElementById('newCatName').value.trim();
    if(name) addCategory(name);
  };

  const addReqBtn = document.getElementById('addReqBtn');
  if(addReqBtn) addReqBtn.onclick = ()=>{
    const label = document.getElementById('newReqLabel').value.trim();
    const category = document.getElementById('newReqCategory').value;
    const minPoints = parseInt(document.getElementById('newReqMinPoints').value) || 0;
    if(label) addRedemptionRequirement(label, category, minPoints);
  };
  content.querySelectorAll('button[data-delete-req]').forEach(btn=>{
    btn.onclick = ()=> deleteRedemptionRequirement(btn.dataset.deleteReq);
  });
  content.querySelectorAll('[data-edit-req-field]').forEach(el=>{
    el.onchange = (e)=> updateRequirementField(el.dataset.editReqId, el.dataset.editReqField, e.target.value);
  });

  const addPointRewardBtn = document.getElementById('addPointRewardBtn');
  if(addPointRewardBtn) addPointRewardBtn.onclick = ()=>{
    const interval = parseInt(document.getElementById('newPointRewardInterval').value) || 30;
    const emoji = document.getElementById('newPointRewardEmoji').value.trim();
    const text = document.getElementById('newPointRewardText').value.trim();
    const requirementId = document.getElementById('newPointRewardReq').value;
    if(text) addPointReward(interval, emoji, text, requirementId);
  };
  content.querySelectorAll('button[data-delete-point-reward]').forEach(btn=>{
    btn.onclick = ()=> deletePointReward(btn.dataset.deletePointReward);
  });
  content.querySelectorAll('[data-edit-pr-field]').forEach(el=>{
    el.onchange = (e)=> updatePointRewardField(el.dataset.editPrId, el.dataset.editPrField, e.target.value);
  });

  const addGoodieBtn = document.getElementById('addGoodieBtn');
  if(addGoodieBtn) addGoodieBtn.onclick = ()=>{
    const level = parseInt(document.getElementById('newGoodieLevel').value) || 1;
    const emoji = document.getElementById('newGoodieEmoji').value.trim();
    const text = document.getElementById('newGoodieText').value.trim();
    const requirementId = document.getElementById('newGoodieReq').value;
    if(text) addGoodie(level, emoji, text, requirementId);
  };
  content.querySelectorAll('button[data-delete-goodie]').forEach(btn=>{
    btn.onclick = ()=> deleteGoodie(btn.dataset.deleteGoodie);
  });
  content.querySelectorAll('[data-edit-goodie-field]').forEach(el=>{
    el.onchange = (e)=> updateGoodieField(el.dataset.editGoodieId, el.dataset.editGoodieField, e.target.value);
  });

  const addTeamBtn = document.getElementById('addTeamBtn');
  if(addTeamBtn) addTeamBtn.onclick = ()=>{
    const name = document.getElementById('newTeamName').value.trim();
    const emoji = document.getElementById('newTeamEmoji').value.trim();
    if(name) addTeam(name, emoji);
  };
  content.querySelectorAll('button[data-delete-team]').forEach(btn=>{
    btn.onclick = ()=> deleteTeam(btn.dataset.deleteTeam);
  });
  content.querySelectorAll('[data-edit-team-field]').forEach(el=>{
    el.onchange = (e)=> updateTeamField(el.dataset.editTeamId, el.dataset.editTeamField, e.target.value);
  });

  if(kid){
    const kidTeamSelect = document.getElementById('kidTeamSelect');
    if(kidTeamSelect) kidTeamSelect.onchange = (e)=> setKidTeam(kid, e.target.value);
  }

  const addSanctionTypeBtn = document.getElementById('addSanctionTypeBtn');
  if(addSanctionTypeBtn) addSanctionTypeBtn.onclick = ()=>{
    const emoji = document.getElementById('newSanctionEmoji').value.trim();
    const label = document.getElementById('newSanctionLabel').value.trim();
    const kind = document.getElementById('newSanctionKind').value;
    const value = parseInt(document.getElementById('newSanctionValue').value) || 0;
    if(label) addSanctionType(emoji, label, kind, value);
  };
  content.querySelectorAll('button[data-delete-sanction-type]').forEach(btn=>{
    btn.onclick = ()=> deleteSanctionType(btn.dataset.deleteSanctionType);
  });
  content.querySelectorAll('[data-edit-st-field]').forEach(el=>{
    el.onchange = (e)=> updateSanctionTypeField(el.dataset.editStId, el.dataset.editStField, e.target.value);
  });

  if(kid){
    const applyTypeSelect = document.getElementById('applySanctionType');
    const applyGoodieSelect = document.getElementById('applySanctionGoodie');
    if(applyTypeSelect && applyGoodieSelect){
      const syncGoodieVisibility = ()=>{
        const st = state.sanctionTypes.find(s=>s.id===applyTypeSelect.value);
        applyGoodieSelect.style.display = (st && st.kind==='goodie') ? '' : 'none';
      };
      applyTypeSelect.onchange = syncGoodieVisibility;
      syncGoodieVisibility();
    }
    const applySanctionBtn = document.getElementById('applySanctionBtn');
    if(applySanctionBtn) applySanctionBtn.onclick = ()=>{
      const typeId = applyTypeSelect.value;
      const note = document.getElementById('applySanctionNote').value.trim();
      const st = state.sanctionTypes.find(s=>s.id===typeId);
      const goodieId = (st && st.kind==='goodie') ? applyGoodieSelect.value : null;
      applySanction(kid, typeId, note, goodieId);
    };

    content.querySelectorAll('button[data-remove-sanction]').forEach(btn=>{
      btn.onclick = ()=> removeSanction(kid, btn.dataset.removeSanction);
    });
  }
}

function openPasswordModal(){
  const modal = document.getElementById('pwModal');
  const input = document.getElementById('pwInput');
  const error = document.getElementById('pwError');
  error.style.display = 'none';
  input.value = '';
  modal.style.display = 'flex';
  setTimeout(()=> input.focus(), 50);
}
function closePasswordModal(){
  document.getElementById('pwModal').style.display = 'none';
}
function submitPassword(){
  const input = document.getElementById('pwInput');
  const error = document.getElementById('pwError');
  if(input.value === PARENT_PASSWORD){
    closePasswordModal();
    parentMode = true;
    render();
  } else {
    error.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

document.getElementById('parentToggle').onclick = ()=>{
  if(!parentMode){
    openPasswordModal();
  } else {
    parentMode = false;
    render();
  }
};
document.getElementById('pwCancel').onclick = closePasswordModal;
document.getElementById('pwSubmit').onclick = submitPassword;
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') submitPassword();
});
document.getElementById('importJsonInput').onchange = (e)=>{
  if(e.target.files[0]) importJson(e.target.files[0]);
  e.target.value = '';
};
function startRealtimeSync(){

supabase
  .channel('family-quest-sync')

  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'app_state'
    },
    payload => {

      if(suppressRealtimeUpdate){
        return;
      }

      if(
        payload.new &&
        payload.new.id === APP_STATE_ID
      ){

        state = payload.new.state;

        render();
      }

    }
  )
  .subscribe();

}

(async () => {

  loadState();

  render();

})();
